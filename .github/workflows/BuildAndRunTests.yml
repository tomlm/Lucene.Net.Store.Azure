name: BuildAndRunTests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
    - source/**
  pull_request:
    branches: [ "main" ]
    paths:
    - source/**
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout AzureDirectory.sln
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore source/AzureDirectory.sln

    - name: Build
      run: dotnet build --no-restore source/AzureDirectory.sln --property WarningLevel=0
      
    - name: Test
      run: dotnet test --no-build --verbosity normal source/AzureDirectory.sln
